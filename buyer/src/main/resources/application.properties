# \u0418\u043C\u044F \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
spring.application.name=buyer-service

# \u041F\u043E\u0440\u0442\u044B (HTTP \u0438 gRPC)
server.port=${PORT:8081}
grpc.server.port=${GRPC_PORT:9093}

# \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044F \u0432 Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0430 \u0443\u043D\u0438\u043A\u0430\u043B\u044C\u043D\u043E\u0433\u043E ID \u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0430 gRPC \u043F\u043E\u0440\u0442\u0430 \u0447\u0435\u0440\u0435\u0437 \u043C\u0435\u0442\u0430\u0434\u0430\u043D\u043D\u044B\u0435
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.metadata-map.grpc-port=${grpc.server.port}

# \u0427\u0430\u0441\u0442\u043E\u0442\u0430 \u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u0438\u044F \u0441\u0442\u0430\u0442\u0443\u0441\u0430 \u0441\u0435\u0440\u0432\u0438\u0441\u0430
eureka.instance.lease-renewal-interval-in-seconds=2
eureka.instance.lease-expiration-duration-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

# \u0410\u043A\u0442\u0438\u0432\u043D\u044B\u0439 \u043F\u0440\u043E\u0444\u0438\u043B\u044C
#spring.profiles.active=file

# \u041F\u0443\u0442\u044C \u043A \u0445\u0440\u0430\u043D\u0438\u043B\u0438\u0449\u0443 \u0441\u043E\u0431\u044B\u0442\u0438\u0439
app.file-storage.path=C:/project/buyer/events_store.txt

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 \u0411\u0430\u0437\u044B \u0414\u0430\u043D\u043D\u044B\u0445
spring.datasource.url=jdbc:postgresql://localhost:5433/buyers_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=buyer-group
spring.kafka.consumer.auto-offset-reset=earliest

# \u0421\u0435\u0440\u0438\u0430\u043B\u0438\u0437\u0430\u0446\u0438\u044F Kafka
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 Circuit Breaker (Resilience4j)
resilience4j.circuitbreaker.instances.banking.sliding-window-size=10
resilience4j.circuitbreaker.instances.banking.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.banking.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.banking.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.banking.permitted-number-of-calls-in-half-open-state=3

# \u041D\u0430\u0441\u0442\u0440\u043E\u0439\u043A\u0438 Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis

# \u041F\u0440\u043E\u043A\u0441\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u043A\u043B\u0430\u0441\u0441\u043E\u0432 (AOP)
spring.aop.proxy-target-class=true

# \u041A\u043E\u0434\u0438\u0440\u043E\u0432\u043A\u0430 \u043A\u043E\u043D\u0441\u043E\u043B\u0438
logging.charset.console=UTF-8