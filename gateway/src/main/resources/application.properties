# \u0418\u043C\u044F \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F
spring.application.name=api-gateway

# \u041F\u043E\u0440\u0442
server.port=8080

# \u0420\u0435\u0433\u0438\u0441\u0442\u0440\u0430\u0446\u0438\u044F \u0432 Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# \u0427\u0430\u0441\u0442\u043E\u0442\u0430 \u043E\u0431\u043D\u043E\u0432\u043B\u0435\u043D\u0438\u044F \u0441\u0442\u0430\u0442\u0443\u0441\u0430 \u0441\u0435\u0440\u0432\u0438\u0441\u0430
eureka.instance.lease-renewal-interval-in-seconds=2
eureka.instance.lease-expiration-duration-in-seconds=5
eureka.client.registry-fetch-interval-seconds=5

# \u041A\u044D\u0448\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0430\u0434\u0440\u0435\u0441\u043E\u0432 \u0438\u043D\u0441\u0442\u0430\u043D\u0441\u043E\u0432
spring.cloud.loadbalancer.cache.enabled=true
spring.cloud.loadbalancer.cache.ttl=10s

# \u041C\u0430\u0440\u0448\u0440\u0443\u0442\u0438\u0437\u0430\u0446\u0438\u044F \u0434\u043B\u044F Buyer Service
spring.cloud.gateway.server.webmvc.routes[0].id=buyer-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://BUYER-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/buyers/**

# \u041C\u0430\u0440\u0448\u0440\u0443\u0442\u0438\u0437\u0430\u0446\u0438\u044F \u0434\u043B\u044F House Service
spring.cloud.gateway.server.webmvc.routes[1].id=house-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://HOUSE-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/houses/**

# \u041C\u0430\u0440\u0448\u0440\u0443\u0442\u0438\u0437\u0430\u0446\u0438\u044F \u0434\u043B\u044F Reactive House Service
spring.cloud.gateway.server.webmvc.routes[2].id=reactive-house-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://REACTIVE-HOUSE-SERVICE
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/webflux/houses/**
